<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Infinitivos — Spanish Vocabulary Game</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.75);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --correct: #22c55e;
    --correct-bg: rgba(34, 197, 94, 0.2);
    --wrong: #ef4444;
    --wrong-bg: rgba(239, 68, 68, 0.2);
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: -1;
    opacity: 0.4;
    animation: float 10s ease-in-out infinite alternate;
  }
  .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #38bdf8; }
  .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: #818cf8; animation-delay: -5s; }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 50px) scale(1.1); }
  }

  .game-container {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 2.5rem;
    width: 90%;
    max-width: 750px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative;
    text-align: center;
    max-height: 95vh;
    overflow-y: auto;
  }

  .header {
    margin-bottom: 1.5rem;
  }

  h1 {
    margin: 0;
    font-size: 1.85rem;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    width: 0%;
    transition: width 0.4s ease;
  }

  .question-container {
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 1.75rem 1rem;
    margin-bottom: 1.5rem;
  }

  .prompt-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 0.35rem;
  }

  .question-text {
    font-size: 1.85rem;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 0.02em;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.85rem;
  }

  .option-btn {
    background: rgba(51, 65, 85, 0.4);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: var(--text-main);
    padding: 1rem 1.2rem;
    border-radius: 12px;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    text-align: left;
  }

  .option-btn:hover:not(:disabled) {
    background: rgba(56, 189, 248, 0.15);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .option-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .key-badge {
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-family: monospace;
    font-weight: bold;
    color: var(--text-muted);
    margin-right: 15px;
    flex-shrink: 0;
  }

  .option-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
    animation: pulseCorrect 0.5s ease;
  }

  .option-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
    animation: shakeWrong 0.4s ease;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 0.95rem;
  }

  .stats { color: var(--text-muted); }
  .score-val { color: var(--accent); font-weight: bold; font-size: 1.1rem; }

  .continue-hint {
    background: var(--accent);
    color: var(--bg-dark);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-weight: bold;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
  }

  .continue-hint.visible {
    opacity: 1;
    transform: translateY(0);
    animation: pulseHint 2s infinite;
  }

  .fade-in { animation: fadeIn 0.35s ease forwards; }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes pulseCorrect {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
  }

  @keyframes pulseHint {
    0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="game-container">
  <div class="header">
    <h1>Senderos — Los Infinitivos</h1>
    <div class="subtitle">Spanish Verb Vocabulary Game</div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div id="game-area">
    <div class="question-container">
      <div class="prompt-label" id="prompt-label">Select the correct translation:</div>
      <div class="question-text" id="question-text">Loading...</div>
    </div>
    
    <div class="options-grid" id="options-grid"></div>
  </div>

  <div class="footer">
    <div class="stats">Score: <span class="score-val" id="score">0</span></div>
    <div class="continue-hint" id="continue-hint">Press ENTER to continue</div>
    <div class="stats">Question <span id="q-counter" class="score-val">0/0</span></div>
  </div>
</div>

<script>
  const VOCAB_DATA = [
    { word: "bailar", def: "to dance" },
    { word: "caminar", def: "to walk" },
    { word: "cantar", def: "to sing" },
    { word: "comer", def: "to eat" },
    { word: "correr", def: "to run" },
    { word: "descansar", def: "to rest" },
    { word: "dibujar", def: "to draw" },
    { word: "dormir", def: "to sleep" },
    { word: "escribir (cuentos)", def: "to write (stories)" },
    { word: "escuchar música", def: "to listen to music" },
    { word: "esquiar", def: "to ski" },
    { word: "estudiar", def: "to study" },
    { word: "hablar por teléfono", def: "to talk on the phone" },
    { word: "hacer la tarea", def: "to do homework" },
    { word: "ir a la escuela", def: "to go to school" },
    { word: "ir de compras", def: "to go shopping" },
    { word: "jugar videojuegos", def: "to play video games" },
    { word: "leer (revistas/libros)", def: "to read (magazines/books)" },
    { word: "montar a caballo", def: "to ride a horse" },
    { word: "montar en bicicleta", def: "to ride a bike" },
    { word: "montar en monopatín / andar en patineta", def: "to skateboard" },
    { word: "nadar", def: "to swim" },
    { word: "pasar tiempo con amigos", def: "to spend time with friends" },
    { word: "pasear", def: "to stroll" },
    { word: "practicar deportes", def: "to practice sports" },
    { word: "preparar la comida", def: "to prepare food" },
    { word: "surfear", def: "to surf" },
    { word: "tocar la guitarra / tocar música", def: "to play the guitar / to play music" },
    { word: "trabajar", def: "to work" },
    { word: "usar la computadora", def: "to use the computer" },
    { word: "ver la tele / mirar la tele", def: "to watch TV" }
  ];

  let gameQueue = [];
  let currentQuestionIndex = 0;
  let score = 0;
  let state = 'playing';
  let autoAdvanceTimer = null;

  const questionText = document.getElementById('question-text');
  const optionsGrid = document.getElementById('options-grid');
  const progressFill = document.getElementById('progress-fill');
  const qCounter = document.getElementById('q-counter');
  const scoreDisplay = document.getElementById('score');
  const continueHint = document.getElementById('continue-hint');
  const gameArea = document.getElementById('game-area');

  function shuffle(array) {
    let copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function initGame() {
    let pool = VOCAB_DATA.map(item => {
      // Pick 3 random wrong definitions
      const wrongPool = VOCAB_DATA.filter(v => v.def !== item.def);
      const randomWrong = shuffle(wrongPool).slice(0, 3).map(v => v.def);
      
      const allOptions = shuffle([...randomWrong, item.def]);
      return {
        prompt: item.word,
        options: allOptions,
        correctIndex: allOptions.indexOf(item.def)
      };
    });

    gameQueue = shuffle(pool);
    currentQuestionIndex = 0;
    score = 0;
    scoreDisplay.textContent = score;
    loadQuestion();
  }

  function loadQuestion() {
    state = 'playing';
    continueHint.classList.remove('visible');
    if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);

    const q = gameQueue[currentQuestionIndex];

    qCounter.textContent = `${currentQuestionIndex + 1}/${gameQueue.length}`;
    progressFill.style.width = `${(currentQuestionIndex / gameQueue.length) * 100}%`;

    gameArea.classList.remove('fade-in');
    void gameArea.offsetWidth;
    gameArea.classList.add('fade-in');

    questionText.textContent = q.prompt;

    optionsGrid.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<div class="key-badge">${i + 1}</div> <div>${opt}</div>`;
      btn.onclick = () => submitAnswer(i);
      optionsGrid.appendChild(btn);
    });
  }

  function submitAnswer(selectedIndex) {
    if (state !== 'playing') return;
    state = 'waiting';

    const q = gameQueue[currentQuestionIndex];
    const buttons = optionsGrid.querySelectorAll('.option-btn');

    buttons.forEach(btn => btn.disabled = true);

    if (selectedIndex === q.correctIndex) {
      buttons[selectedIndex].classList.add('correct');
      score++;
      scoreDisplay.textContent = score;
    } else {
      buttons[selectedIndex].classList.add('wrong');
      buttons[q.correctIndex].classList.add('correct');
    }

    continueHint.classList.add('visible');
    autoAdvanceTimer = setTimeout(nextQuestion, 2800);
  }

  function nextQuestion() {
    if (state === 'ended') return;
    if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);

    currentQuestionIndex++;
    if (currentQuestionIndex < gameQueue.length) {
      loadQuestion();
    } else {
      endGame();
    }
  }

  function endGame() {
    state = 'ended';
    continueHint.classList.remove('visible');
    progressFill.style.width = '100%';

    gameArea.classList.remove('fade-in');
    void gameArea.offsetWidth;
    gameArea.classList.add('fade-in');

    document.getElementById('prompt-label').textContent = 'Session Complete!';
    questionText.innerHTML = `You scored ${score} out of ${gameQueue.length}!`;

    optionsGrid.innerHTML = `
      <button class="option-btn" style="justify-content: center; background: rgba(56, 189, 248, 0.15); border-color: #38bdf8;" onclick="initGame()">
        <div class="key-badge" style="width: auto; padding: 0 10px;">ENTER</div>
        <div>Play Again</div>
      </button>
    `;
  }

  document.addEventListener('keydown', (e) => {
    if (state === 'playing') {
      const key = parseInt(e.key);
      const q = gameQueue[currentQuestionIndex];
      if (key >= 1 && key <= q.options.length) {
        submitAnswer(key - 1);
      }
    } else if (state === 'waiting' && e.key === 'Enter') {
      nextQuestion();
    } else if (state === 'ended' && e.key === 'Enter') {
      initGame();
    }
  });

  initGame();
</script>
</body>
</html>
